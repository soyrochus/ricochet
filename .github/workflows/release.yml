name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.99.1'
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Accept only vMAJOR.MINOR.PATCH, matching Cargo.toml's version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$RELEASE_TAG' is not of the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match the version in Cargo.toml ($version)" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner builds for its own native architecture; there is no
          # cross-compilation, so there is nothing to pass as `--target`.
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Run tests, with and without the development harness
        run: |
          cargo test --locked
          cargo test --features dev-harness --locked
      - name: Build development-harness examples, then the plain release binary
        run: |
          cargo build --release --examples --features dev-harness --locked
          cargo build --release --locked
      - name: Synthetic PTY protocol/lifecycle checks (not a Ghostty emulator)
        run: python3 tools/verify_pty.py
      - name: Smoke test the release executable
        run: |
          binary="target/release/ricochet"
          test "$("$binary" --version)" = "ricochet ${RELEASE_TAG#v}"
          "$binary" --help
      - name: Bundle the executable with its README and licence
        run: |
          stage="ricochet-${RELEASE_TAG}-${{ matrix.platform }}"
          mkdir "$stage"
          cp target/release/ricochet README.md LICENSE "$stage/"
          mkdir -p dist
          tar -czf "dist/$stage.tar.gz" "$stage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Require both platform archives and generate checksums
        working-directory: dist
        run: |
          test "$(ls -1 *.tar.gz | wc -l)" -eq 2
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release (or finish an existing draft)
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release $RELEASE_TAG is already published; refusing to overwrite its assets."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Ricochet $RELEASE_TAG" --generate-notes
          fi
